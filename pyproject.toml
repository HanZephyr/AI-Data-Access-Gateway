[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-data-access-gateway"
version = "0.1.0"
description = "Secure data access gateway for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Data Access Gateway Contributors" }]
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "sqlglot>=25.24.5",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.1"]
mysql = ["pymysql>=1.1.1"]
doris = ["pymysql>=1.1.1"]
all = ["psycopg[binary]>=3.2.1", "pymysql>=1.1.1"]
dev = [
  "httpx>=0.27.2",
  "mypy>=1.11.2",
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.4",
]

[project.scripts]
adg-api = "adg.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/adg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = []
