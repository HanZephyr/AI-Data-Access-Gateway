services:
  backend:
    build: .
    environment:
      ADG_ENV: production
      ADG_CONTROL_PLANE_DATABASE_URL: sqlite:///./data/adg-control-plane.db
      ADG_SECRET_KEY: ${ADG_SECRET_KEY:?Set ADG_SECRET_KEY before starting docker compose}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn adg.app.main:create_app --factory --host 0.0.0.0 --port 8000"
    volumes:
      - adg-data:/app/data

  web:
    image: node:20-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  adg-data:
